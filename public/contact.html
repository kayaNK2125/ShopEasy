<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ShopEasy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="nav-logo">🛍️ ShopEasy</div>
            <div class="nav-links">
                <a href="index.html"><button class="nav-btn">HOME</button></a>
                <a href="index.html"><button class="nav-btn">FASHION</button></a>
                <a href="index.html"><button class="nav-btn">ELECTRONICS</button></a>
                <a href="index.html"><button class="nav-btn">WIRELESS</button></a>
                <a href="contact.html"><button class="nav-btn active">CONTACT-US</button></a>
            </div>
            <div class="nav-icons">
                <a href="cart.html"><button class="cart-btn">🛒 <span class="cart-count">0</span></button></a>
                <a href="login.html"><button class="login-nav-btn">Login</button></a>
            </div>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card" style="max-width: 500px;">
            <h2>Contact Us 📩</h2>
            <p class="auth-subtitle">We'd love to hear from you</p>

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="contact-name" placeholder="Your name" />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="contact-email" placeholder="Your email" />
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="contact-msg" placeholder="Your message..." 
                style="width:100%; padding:0.7rem 1rem; border:2px solid #eee; border-radius:10px; font-family:'Fredoka',sans-serif; font-size:1rem; height:120px; outline:none; resize:none;"></textarea>
            </div>

            <button class="auth-btn" onclick="sendMessage()">Send Message</button>
        </div>
    </section>

    <script>
        // update navbar cart count from localStorage
        const _cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.querySelector('.cart-count').textContent = _cart.length;

        function sendMessage() {
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const msg = document.getElementById('contact-msg').value;

            if(!name || !email || !msg) {
                alert('Please fill all fields!');
                return;
            }
            alert(`Thanks ${name}! We'll get back to you at ${email} soon.`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
