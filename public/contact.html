<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ShopEasy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="nav-logo">🛍️ ShopEasy</div>
            <div class="nav-links">
                <a href="index.html"><button class="nav-btn">HOME</button></a>
                <a href="index.html"><button class="nav-btn">FASHION</button></a>
                <a href="index.html"><button class="nav-btn">ELECTRONICS</button></a>
                <a href="index.html"><button class="nav-btn">WIRELESS</button></a>
                <a href="contact.html"><button class="nav-btn active">CONTACT US</button></a>
            </div>
            <div class="nav-icons">
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
                <a href="cart.html"><button class="cart-btn">🛒 <span class="cart-count">0</span></button></a>
                <a href="login.html"><button class="login-nav-btn">Login</button></a>
            </div>
        </nav>
    </header>

    <section class="auth-section">

        <!-- LEFT PANEL - contact info -->
        <div class="auth-left">
            <div class="auth-brand">
                <div class="brand-logo">📬 Contact Us</div>
                <h2>We'd Love to Hear From You</h2>
                <p>Questions, feedback, or just want to say hello? Reach out anytime.</p>
                <div class="brand-features">
                    <div class="feature">📧 support@shopeasy.in</div>
                    <div class="feature">📞 +91 98765 43210</div>
                    <div class="feature">📍 Mumbai, Maharashtra</div>
                    <div class="feature">⏰ Mon–Sat, 9am – 6pm</div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL - form -->
        <div class="auth-right">
            <div class="auth-card" style="max-width: 480px;">
                <h2>Send a Message</h2>
                <p class="auth-subtitle">We'll get back to you within 24 hours</p>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="contact-name" placeholder="Your full name" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="contact-email" placeholder="Your email address" />
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="contact-msg" class="contact-textarea" placeholder="Write your message here..."></textarea>
                </div>

                <button class="auth-btn" onclick="sendMessage()">Send Message</button>
            </div>
        </div>
    </section>

    <script src="theme.js"></script>
    <script>
        const _cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.querySelector('.cart-count').textContent = _cart.reduce((s, i) => s + (i.qty || 1), 0);

        function sendMessage() {
            const name  = document.getElementById('contact-name').value.trim();
            const email = document.getElementById('contact-email').value.trim();
            const msg   = document.getElementById('contact-msg').value.trim();
            if (!name || !email || !msg) { alert('Please fill all fields!'); return; }
            alert(`Thanks ${name}! We'll get back to you at ${email} within 24 hours.`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
